# KITTI SGBM 双目视差 —— 最终参数（阶段一选定：配置 B5）
#
# 选定依据：阶段一第一至第六步的逐层实验，见
#   "阶段一 理解并调整 SGBM 参数/说明文档/" 下各步的《参数组合保留原因》
# 最终一步的完整结论见：阶段一第六步参数组合保留原因.md（§7 选择理由、§8 第六步参数保留结果）
#
# 选参数据：KITTI 训练集 150 个选参场景（data_split/tune），真值 disp_noc_0
# 锁定时点：阶段一结束时锁定，阶段二不得再修改（要用未参与选参的 50 个场景独立验收）
#
# 为什么是 B5 而不是 A5（两者公共区域 D1 仅差 0.0007 个百分点，属并列）：
#   B5 在困难场景尾部和覆盖率上更好——P90 低 0.3253、最差场景低 2.3617 个百分点、
#   有效像素比例高 0.6286 个百分点；A5 则在逐场景胜负（83:65）和速度上略优。
#   本项目面向智能车辆测距，尾部稳定性与覆盖率优先，故选 B5。

sgbm:
  minDisparity: 0            # 视差搜索起点
  numDisparities: 128        # 搜索范围 0~127；实测覆盖选参集 99.9973% 的真值像素
  blockSize: 9               # 匹配块边长（奇数）
  P1: 1296                   # 平滑惩罚（= 8 × blockSize²）
  P2: 5184                   # 平滑惩罚（= 32 × blockSize²），须 P2 > P1
  disp12MaxDiff: 128         # 左右一致性检查容差；越大越松，128 在实践中近似不检查
  preFilterCap: 63           # 预处理 Sobel 截断值（1~63）
  uniquenessRatio: 0         # 0 = 关闭唯一性检查（实测开启会同时降低精度与覆盖率）
  speckleWindowSize: 100     # 斑点过滤窗口；0 = 关闭
  speckleRange: 2            # 斑点过滤的视差差阈值
  mode: SGBM_3WAY            # 代价聚合模式；实测优于 SGBM 与 HH

# 选参集实测指标（150 场景，disp_noc_0 真值，仅供阶段二对照）：
#   公共区域D1     7.8309%   （统一排除左侧 128 列）
#   全图严格D1    13.1108%   （算法无效像素按错误计入）
#   有效区域D1     6.3633%
#   EPE            3.9268
#   有效像素比例  87.5022%
#   中位耗时       0.0404 s（≈24.78 FPS，预热后重复 3 次取中位）
#   逐场景D1：中位 11.8696%，P90 18.0360%，最差 71.0396%（场景 000104）
#
# 已知限制：
#   · 上述指标用非遮挡真值；遮挡区域与整图表现留到阶段二补充检查
